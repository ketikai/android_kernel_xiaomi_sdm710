name: Select KernelSU

on:
  workflow_call:
    inputs:
      provider:
        type: string
        required: true
    outputs:
      setup_script:
        value: ${{ jobs.select.outputs.setup_script }}
      setup_branch:
        value: ${{ jobs.select.outputs.setup_branch }}
      manual_hooks:
        value: ${{ jobs.select.outputs.manual_hooks }}
      custom_env_or_config:
        value: ${{ jobs.select.outputs.custom_env_or_config }}

jobs:
  select:
    runs-on: ubuntu-22.04
    outputs:
      setup_script: ${{ steps.export_ksu_configs.outputs.setup_script }}
      setup_branch: ${{ steps.export_ksu_configs.outputs.setup_branch }}
      manual_hooks: ${{ steps.export_ksu_configs.outputs.manual_hooks }}
      custom_env_or_config: ${{ steps.export_ksu_configs.outputs.custom_env_or_config }}
    steps:
    - name: Export KernelSU Configurations
      id: export_ksu_configs
      run: |
        PROVIDER="${{ inputs.provider }}"
        SETUP_SCRIPT=""
        SETUP_BRANCH=""
        MANUAL_HOOKS="https://github.com/ketikai/android_kernel_xiaomi_sdm710/releases/download/prebuilt/$PROVIDER-manual-hooks.tar.xz"
        CUSTOM_ENV_OR_CONFIG=""
        case "$PROVIDER" in
          xxksu)
            SETUP_SCRIPT="https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh"
            SETUP_BRANCH="master"
            ;;
          resuki)
            SETUP_SCRIPT="https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh"
            SETUP_BRANCH="main"
            CUSTOM_ENV_OR_CONFIG="CONFIG_KALLSYMS_ALL=y CONFIG_KSU_MANUAL_HOOK=y"
            ;;
          susfs)
            SETUP_SCRIPT="https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh"
            SETUP_BRANCH="main"
            CUSTOM_ENV_OR_CONFIG="CONFIG_KALLSYMS_ALL=y CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_PATH=y CONFIG_KSU_SUSFS_SUS_MOUNT=y CONFIG_KSU_SUSFS_SUS_KSTAT=y CONFIG_KSU_SUSFS_SPOOF_UNAME=y CONFIG_KSU_SUSFS_ENABLE_LOG=y CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y CONFIG_KSU_SUSFS_OPEN_REDIRECT=y CONFIG_KSU_SUSFS_SUS_MAP=y"
            ;;
          *)
            echo "不支持的 KernelSU 服务提供方: '$PROVIDER'" >&2
            exit 1
            ;;
        esac
        
        CUSTOM_ENV_OR_CONFIG="$CUSTOM_ENV_OR_CONFIG CONFIG_SYSCTL=y CONFIG_SYSVIPC=y CONFIG_POSIX_MQUEUE=y CONFIG_NAMESPACES=y CONFIG_PID_NS=y CONFIG_UTS_NS=y CONFIG_IPC_NS=y CONFIG_SECCOMP=y CONFIG_SECCOMP_FILTER=y CONFIG_CGROUPS=y CONFIG_CGROUP_DEVICE=y CONFIG_CGROUP_SCHED=y CONFIG_FAIR_GROUP_SCHED=y CONFIG_CGROUP_FREEZER=y CONFIG_CGROUP_NET_PRIO=y CONFIG_MEMCG=y CONFIG_MEMCG_SWAP=y CONFIG_CFS_BANDWIDTH=y CONFIG_CGROUP_PIDS=y CONFIG_CGROUP_CPUACCT=y CONFIG_DEVTMPFS=y CONFIG_OVERLAY_FS=y CONFIG_TMPFS_POSIX_ACL=y CONFIG_TMPFS_XATTR=y CONFIG_FW_LOADER=y CONFIG_FW_LOADER_USER_HELPER=y CONFIG_FW_LOADER_COMPRESS=y CONFIG_NET_NS=y CONFIG_VETH=y CONFIG_BRIDGE=y CONFIG_NETFILTER=y CONFIG_BRIDGE_NETFILTER=y CONFIG_NETFILTER_ADVANCED=y CONFIG_NF_CONNTRACK=y CONFIG_IP_NF_IPTABLES=y CONFIG_IP_NF_FILTER=y CONFIG_NF_NAT=y CONFIG_NF_TABLES=y CONFIG_IP_NF_TARGET_MASQUERADE=y CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y CONFIG_NETFILTER_XT_TARGET_TCPMSS=y CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y CONFIG_NF_CONNTRACK_NETLINK=y CONFIG_NF_NAT_REDIRECT=y CONFIG_IP_ADVANCED_ROUTER=y CONFIG_IP_MULTIPLE_TABLES=y CONFIG_NF_CONNTRACK_IPV4=y CONFIG_NF_NAT_IPV4=y CONFIG_IP_NF_NAT=y CONFIG_IPV6=y CONFIG_IPV6_MULTIPLE_TABLES=y CONFIG_IP6_NF_IPTABLES=y CONFIG_IP6_NF_FILTER=y CONFIG_IP6_NF_MANGLE=y CONFIG_IP6_NF_NAT=y CONFIG_IP6_NF_TARGET_MASQUERADE=y CONFIG_NF_CONNTRACK_IPV6=y CONFIG_NF_NAT_IPV6=y CONFIG_MACVLAN=y CONFIG_ANDROID_PARANOID_NETWORK=n CONFIG_USER_NS=y CONFIG_NETFILTER_XT_MATCH_COMMENT=y CONFIG_NETFILTER_XT_MATCH_STATE=y CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y CONFIG_NETFILTER_XT_MATCH_HL=y CONFIG_IP_NF_TARGET_REJECT=y CONFIG_IP6_NF_TARGET_REJECT=y CONFIG_NETFILTER_XT_TARGET_LOG=y CONFIG_IP_NF_TARGET_ULOG=y CONFIG_NETFILTER_XT_MATCH_RECENT=y CONFIG_NETFILTER_XT_MATCH_LIMIT=y CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y CONFIG_NETFILTER_XT_MATCH_OWNER=y CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y CONFIG_NETFILTER_XT_MATCH_MARK=y CONFIG_NETFILTER_XT_TARGET_MARK=y CONFIG_IP_SET=y CONFIG_IP_SET_HASH_IP=y CONFIG_IP_SET_HASH_NET=y CONFIG_NETFILTER_XT_SET=y CONFIG_NETFILTER_NETLINK_QUEUE=y CONFIG_NETFILTER_NETLINK_LOG=y CONFIG_NETFILTER_XT_TARGET_NFLOG=y"

        echo "setup_script=$SETUP_SCRIPT" >> $GITHUB_OUTPUT
        echo "setup_branch=$SETUP_BRANCH" >> $GITHUB_OUTPUT
        echo "manual_hooks=$MANUAL_HOOKS" >> $GITHUB_OUTPUT
        echo "custom_env_or_config=$CUSTOM_ENV_OR_CONFIG" >> $GITHUB_OUTPUT
